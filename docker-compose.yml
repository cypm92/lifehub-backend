services:
  postgres_db:
    image: postgres:16-alpine
    container_name: lifehub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifehub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifehub_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: lifehub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/lifehub_db
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      ADMIN_EMAIL: admin@lifehub.com
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres_db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    container_name: lifehub_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
